version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - NUM_PARTITIONS=3
    depends_on:
      redis:
        condition: service_healthy

  processor-0:
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - PROCESSOR_PARTITION_ID=0
      - PROCESSOR_NUM_PARTITIONS=3
    depends_on:
      redis:
        condition: service_healthy

  processor-1:
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - PROCESSOR_PARTITION_ID=1
      - PROCESSOR_NUM_PARTITIONS=3
    depends_on:
      redis:
        condition: service_healthy

  processor-2:
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - PROCESSOR_PARTITION_ID=2
      - PROCESSOR_NUM_PARTITIONS=3
    depends_on:
      redis:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    environment:
      - INGEST_URL=http://ingest:8000
    depends_on:
      - ingest
